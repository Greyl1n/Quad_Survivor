<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self'; connect-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Quad Survivor: The Pixel Swarm - High-octane retro roguelite survivor with real-time C64 SID chiptune synthesis, procedural level genomes, 3:4 CRT arcade emulation, 12 unique weapons, and virtual joystick.">
  <meta property="og:title" content="Quad Survivor: The Pixel Swarm">
  <meta property="og:description" content="Play Quad Survivor in your browser! Retro sci-fi roguelite survivor with real-time chiptune audio, 12 weapons, and arcade CRT scanlines.">
  <meta property="og:image" content="icon.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quad Survivor: The Pixel Swarm">
  <meta name="twitter:description" content="Retro sci-fi roguelite survivor with real-time chiptune audio, 12 weapons, and arcade CRT scanlines.">
  <meta name="twitter:image" content="icon.png">

  <title>Quad Survivor: The Pixel Swarm</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0e16;
      font-family: 'Consolas', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #0c0e16;
      cursor: crosshair;
    }

    #loadingOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0c0e16;
      color: #00f0dc;
      font-size: 20px;
      font-weight: bold;
      z-index: 99;
      pointer-events: none;
      transition: opacity 0.4s ease;
      text-align: center;
      padding: 20px;
    }

    .title-glow {
      font-size: 32px;
      margin-bottom: 12px;
      color: #00f0dc;
      text-shadow: 0 0 12px rgba(0, 240, 220, 0.6), 0 0 24px rgba(0, 240, 220, 0.3);
      letter-spacing: 2px;
    }

    .subtitle-glow {
      font-size: 14px;
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
      letter-spacing: 1.5px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      100% { opacity: 1.0; }
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="title-glow">QUAD SURVIVOR</div>
    <div class="subtitle-glow">INITIALIZING QUANTUM CORE...</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script src="game.js"></script>
</body>
</html>
